name: Run Local AI Engine Workflow

on:
  push:
    paths:
      - 'prompt.txt'

jobs:
  execute-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Python Generation Engine
      run: python ai_engine.py

    - name: Commit Generation Output back to GitHub
      run: |
        git config --global user.name "GitHub Action Runner"
        git config --global user.email "actions@github.com"
        git add output.txt
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Local Engine: Updated Generation Output"
        git push
