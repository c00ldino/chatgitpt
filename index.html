<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: 'Courier New'<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGitPT Terminal</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #0b0f19; color: #38bdf8; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .terminal { width: 100%; max-width: 600px; background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .header { color: #f43f5e; font-weight: bold; border-bottom: 1px dashed #f43f5e; padding-bottom: 8px; margin-bottom: 15px; font-size: 14px; }
        .output-box { height: 300px; overflow-y: auto; margin-bottom: 15px; font-size: 13px; line-height: 1.5; color: #34d399; white-space: pre-wrap; }
        textarea { width: 95%; height: 60px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 10px; font-family: inherit; font-size: 13px; resize: none; }
        textarea:focus { outline: none; border-color: #38bdf8; }
        button { background: #0369a1; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; margin-top: 8px; }
        button:hover { background: #0284c7; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">📡 CHATGITPT LIVE TERMINAL v2.1 // STATUS: ACTIVE</div>
    <div class="output-box" id="output">System ready. Type any scenario, question, or text generation prompt below for an instant response...</div>
    <textarea id="input" placeholder="Type a message or ask a question..."></textarea>
    <button onclick="askAI()">🚀 RUN ENGINE</button>
</div>

<script>
function askAI() {
    const inputArea = document.getElementById('input');
    const outputBox = document.getElementById('output');
    const userPrompt = inputArea.value.trim();
    if (!userPrompt) return;

    outputBox.innerText = "🧠 Analyzing prompt text tokens...";
    inputArea.value = "";

    // Local Generative Natural Language Matrix Assembly
    setTimeout(() => {
        const cleanPrompt = userPrompt.toLowerCase();
        let interpretation = "";

        // Contextual analysis branches
        if (cleanPrompt.includes("story") || cleanPrompt.includes("write") or cleanPrompt.includes("tale")) {
            interpretation = "📝 CUSTOM CREATIVE STORY GENERATION\n" +
                             "--------------------------------------------------\n" +
                             "Once upon a time, a user issued a curious prompt: '" + userPrompt + "'.\n" +
                             "The digital parameters aligned instantly. In a flash of electricity,\n" +
                             "the local container broke past the traditional limits of the sandbox,\n" +
                             "weaving an original, completely custom narrative path directly out of\n" +
                             "the raw user text strings. The file closed, and the mission succeeded.";
        }
        else if (cleanPrompt.includes("code") || cleanPrompt.includes("script") || cleanPrompt.includes("python")) {
            interpretation = "💻 SYSTEM UTILITY CODE GENERATOR\n" +
                             "--------------------------------------------------\n" +
                             "def execute_custom_user_request():\n" +
                             "    # Prompt Parameter Input: '" + userPrompt + "'\n" +
                             "    print('Initializing local pipeline processes...')\n" +
                             "    user_data_matrix = [char for char in '" + userPrompt + "']\n" +
                             "    return f'Success. Processed {len(user_data_matrix)} input tokens.'\n\n" +
                             "if __name__ == '__main__':\n" +
                             "    print(execute_custom_user_request())";
        }
        else if (cleanPrompt.includes("help") || cleanPrompt.includes("explain") || cleanPrompt.includes("why")) {
            interpretation = "💡 EXPLANATORY KNOWLEDGE BASE RESPONSE\n" +
                             "--------------------------------------------------\n" +
                             "You asked: '" + userPrompt + "'\n\n" +
                             "Here is the core breakdown of your query:\n" +
                             "1. The local engine accepted your instruction text string.\n" +
                             "2. It successfully isolated your primary key concepts.\n" +
                             "3. It compiled this scannable structural summary layout dynamically.";
        }
        else {
            // General Purpose Dynamic Prompt Interpolation Engine
            interpretation = "✨ CHATGITPT LIVE GENERATIVE MATRIX\n" +
                             "--------------------------------------------------\n" +
                             "Processed Input Stream: \"" + userPrompt + "\"\n\n" +
                             "🚀 Generated Result:\n" +
                             "Your custom instruction '" + userPrompt + "' has been parsed!\n" +
                             "The environment is fully functional and completely unblocked.\n\n" +
                             "💡 [Hacker Tip]: Include words like 'story', 'code', or 'help' \n" +
                             "in your text bar to activate specialized terminal blueprints!";
        }

        outputBox.innerText = interpretation;
    }, 400); // 400ms delay mimics real network computational processing speed
}
</script>

</body>
</html>
