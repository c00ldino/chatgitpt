<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGitPT Terminal</title>
    <style>
        body { 
            font-family: 'Courier New', monospace; 
            background-color: #05070f; 
            color: #38bdf8; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 90vh;
            margin: 0;
        }
        .terminal { 
            width: 100%; 
            max-width: 650px; 
            background: #02040a; 
            border: 1px solid #0284c7; 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15); 
        }
        .header { 
            color: #f43f5e; 
            font-weight: bold; 
            border-bottom: 1px dashed #f43f5e; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            font-size: 13px; 
            letter-spacing: 1px;
        }
        .output-box { 
            height: 280px; 
            overflow-y: auto; 
            margin-bottom: 15px; 
            font-size: 13px; 
            line-height: 1.6; 
            color: #34d399; 
            white-space: pre-wrap; 
            background: #010205;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1e293b;
        }
        textarea { 
            width: 96%; 
            height: 55px; 
            background: #090d16; 
            color: #f8fafc; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            padding: 10px; 
            font-family: inherit; 
            font-size: 13px; 
            resize: none; 
            margin-bottom: 8px;
        }
        textarea:focus { outline: none; border-color: #38bdf8; }
        .btn-container { display: flex; gap: 10px; }
        button { 
            background: #0369a1; 
            color: white; 
            border: none; 
            padding: 12px; 
            flex: 3;
            border-radius: 6px; 
            cursor: pointer; 
            font-family: inherit; 
            font-weight: bold; 
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover { background: #0284c7; }
        button:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; }
        /* Style for the secondary reset button action */
        .btn-reset {
            background: #9f1239;
            color: #fecdd3;
            flex: 1;
        }
        .btn-reset:hover { background: #be123c; color: white; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">📡 CHATGITPT LOCAL BRAIN v4.5 // SECURLY BYPASS</div>
    <div class="output-box" id="output">System booting... Readying data nodes...</div>
    <textarea id="input" placeholder="Type an original sentence starter..." disabled></textarea>
    <div class="btn-container">
        <button id="run-btn" disabled>⏳ CONNECTED TO MODEL CORRIDOR...</button>
        <button id="reset-btn" class="btn-reset" disabled>🧹 RESET</button>
    </div>
</div>

<script type="module">
    import { pipeline } from 'https://jsdelivr.net';

    const outputBox = document.getElementById('output');
    const inputArea = document.getElementById('input');
    const runBtn = document.getElementById('run-btn');
    const resetBtn = document.getElementById('reset-btn');
    let generator = null;

    async function initAI() {
        try {
            outputBox.innerText = "⏳ Allocating neural text tokens into browser sandboxed memory...\n(Takes ~10 seconds on the very first visit to pull down weights!)";
            
            generator = await pipeline('text-generation', 'Xenova/distilgpt2');
            
            outputBox.innerText = "🟩 AI Pipeline operational. Completely local web worker container.\nType an original phrase below and click the button to compute a continuation!";
            inputArea.disabled = false;
            runBtn.disabled = false;
            resetBtn.disabled = false;
            runBtn.innerText = "🚀 RUN NEURAL MATRIX";
        } catch (e) {
            outputBox.innerText = "❌ Pipeline Blocked: " + e.message + "\nYour school firewall nodes might be stopping structural file delivery loops.";
        }
    }

    // Logic processing runner action loop
    runBtn.addEventListener('click', async () => {
        const userPrompt = inputArea.value.trim();
        if (!userPrompt || !generator) return;

        outputBox.innerText = "🧠 Computing next logical text matrix steps from scratch...";
        inputArea.value = "";
        runBtn.disabled = true;

        try {
            const output = await generator(userPrompt, {
                max_new_tokens: 45,
                temperature: 0.8,
                do_sample: true
            });

            outputBox.innerText = "✨ DYNAMICALLY COMPUTED MACHINE ARTIFACT:\n\n" + output.generated_text;
        } catch (error) {
            outputBox.innerText = "❌ Generation Matrix Failure: " + error.message;
        }
        runBtn.disabled = false;
    });

    // Reset workflow behavior connection
    resetBtn.addEventListener('click', () => {
        inputArea.value = "";
        outputBox.innerText = "🟩 Terminal cleared. Ready for fresh prompt strings.";
    });

    initAI();
</script>

</body>
</html>
