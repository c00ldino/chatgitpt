<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c00lgui terminal</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 90vh;
            margin: 0;
            background-image: repeating-linear-gradient(0deg, #111 0px, #111 2px, #1a1a1a 2px, #1a1a1a 4px);
        }

        /* 🟥 Authentic c00lgui Black & Thick Red Border Shell Frame */
        .terminal { 
            width: 100%; 
            max-width: 500px; 
            background: #000000; 
            border: 6px solid #ff0000; 
            border-radius: 0px; 
            padding: 12px; 
            box-shadow: 6px 6px 0px #000000;
            box-sizing: border-box;
        }
        
        .header { 
            color: #ffffff; 
            font-weight: bold; 
            font-size: 26px;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: lowercase;
            text-shadow: 2px 2px #ff0000;
        }
        
        .output-box { 
            height: 160px; 
            overflow-y: auto; 
            margin-bottom: 12px; 
            font-size: 14px; 
            line-height: 1.4; 
            color: #34d399; 
            white-space: pre-wrap; 
            background: #000000;
            padding: 10px;
            border: 4px solid #ff0000;
            border-radius: 0px;
            font-family: monospace;
        }

        .input-wrapper {
            background: #000000;
            border: 4px solid #ff0000;
            padding: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        textarea { 
            width: 95%; 
            height: 45px; 
            background: #111111; 
            color: #ffffff; 
            border: 2px solid #ff0000; 
            border-radius: 0px; 
            padding: 8px; 
            font-family: inherit; 
            font-size: 14px; 
            resize: none; 
            display: block;
            margin: 0 auto;
            text-transform: uppercase;
        }
        
        textarea:focus { 
            outline: none; 
            background: #000000;
        }
        
        /* Exploit Grid Module Layout (Two-Column Format) */
        .exploit-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            width: 100%; 
        }
        
        button { 
            background: #ff0000; 
            color: #ffffff; 
            border: 2px solid #ffffff; 
            padding: 10px; 
            font-family: inherit; 
            font-weight: bold; 
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 0px;
            transition: background 0.1s;
        }
        
        button:hover { 
            background: #cc0000;
        }
        
        button:disabled { 
            background: #333333; 
            color: #777777;
            border-color: #555555;
            cursor: not-allowed; 
        }
        
        .btn-utility {
            background: #222222;
            border-color: #ff0000;
        }
        .btn-utility:hover {
            background: #333333;
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">c00lgui xddd</div>
    
    <div class="output-box" id="output">SYSTEM BOOT: ALLOCATING NEURAL WEIGHT FILE CONTAINERS IN MEMORY...</div>
    
    <div class="input-wrapper">
        <textarea id="input" placeholder="ENTER INSTRUCTION COMMAND VECTOR DATA..." disabled></textarea>
    </div>
    
    <div class="exploit-grid">
        <button id="run-btn" disabled>LOADING HAXX...</button>
        <button id="reset-btn" class="btn-utility" disabled>PURGE ALL</button>
        <button id="sky-btn" class="btn-utility" disabled>SET SKYBOX</button>
        <button id="esp-btn" class="btn-utility" disabled>ESP TRACK</button>
    </div>
</div>

<script type="module">
    import { pipeline } from 'https://jsdelivr.net';

    const outputBox = document.getElementById('output');
    const inputArea = document.getElementById('input');
    const runBtn = document.getElementById('run-btn');
    const resetBtn = document.getElementById('reset-btn');
    const skyBtn = document.getElementById('sky-btn');
    const espBtn = document.getElementById('esp-btn');
    let generator = null;

    async function initAI() {
        try {
            outputBox.innerText = "⏳ FETCHING THE REAL GENERATIVE AI MODEL FROM CLOUD STORAGE MATRIX FOLDS...\n(Takes ~10 seconds on first load to buffer parameters!)";
            
            // Setting up a fully local language model that runs directly inside your Chromebook's processor
            generator = await pipeline('text-generation', 'Xenova/distilgpt2');
            
            outputBox.innerText = "🟩 TEAM C00LKIDD ENGINE ONLINE // UNBLOCKED VISOR NODE ACTIVE.\nTYPE AN ORIGINAL PROMPT OR STORY STARTER BELOW AND RUN MODULE.";
            inputArea.disabled = false;
            runBtn.disabled = false;
            resetBtn.disabled = false;
            skyBtn.disabled = false;
            espBtn.disabled = false;
            runBtn.innerText = "CLICK 2 RUN H4X!!";
        } catch (e) {
            outputBox.innerText = "❌ PIPELINE INJECT FAILURE: " + e.message;
        }
    }

    // Direct module level event listeners prevent the button from freezing up
    runBtn.addEventListener('click', async () => {
        const userPrompt = inputArea.value.trim();
        if (!userPrompt || !generator) return;

        outputBox.innerText = "🧠 CHATGITPT IS THINKING FROM SCRATCH... GENERATING UNPREDICTABLE TEXT CORES...";
        inputArea.value = "";
        runBtn.disabled = true;

        try {
            const output = await generator(userPrompt, {
                max_new_tokens: 50,
                temperature: 0.8,
                do_sample: true
            });

            outputBox.innerText = "✨ REAL COMPUTED AI TEXT ARTIFACT:\n\n" + output.generated_text.toUpperCase();
        } catch (error) {
            outputBox.innerText = "❌ INJECTION EXCEPTION: " + error.message.toUpperCase();
        }
        runBtn.disabled = false;
    });

    resetBtn.addEventListener('click', () => {
        inputArea.value = "";
        outputBox.innerText = "BUFFER STATUS PURGED. READY FOR NEW DATA VECTOR STRINGS.";
    });

    skyBtn.addEventListener('click', () => {
        outputBox.innerText = "⚡ SKYBOX OVERRIDE: INJECTING TEAM C00LKIDD RED GLITCH TEXTURES TO ENVIRONMENT...!!";
    });

    espBtn.addEventListener('click', () => {
        outputBox.innerText = "🛰️ ESP RENDERED: LOCATING SURVIVOR GRID NODES AND GENERATOR TELEMETRY LOCATIONS SUCCESSFUL.";
    });

    initAI();
</script>

</body>
</html>
