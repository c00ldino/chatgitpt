<script>
    const outputBox = document.getElementById('output');
    const inputArea = document.getElementById('input');
    const runBtn = document.getElementById('run-btn');
    const resetBtn = document.getElementById('reset-btn');
    const skyBtn = document.getElementById('sky-btn');
    const espBtn = document.getElementById('esp-btn');

    function initAI() {
        outputBox.innerText = "TEAM C00LKIDD JOIN TODAY!!! FAST MATRIX PROXY ONLINE. INPUT COMMAND NOW.";
        inputArea.disabled = false;
        runBtn.disabled = false;
        resetBtn.disabled = false;
        skyBtn.disabled = false;
        espBtn.disabled = false;
        runBtn.innerText = "CLICK 2 RUN H4X!!";
    }

    async function executeHax() {
        const userPrompt = inputArea.value.trim();
        if (!userPrompt) return;

        outputBox.innerText = "COMPUTING VALUE MATRIX STEPS... TH1NK F4ST!!!";
        inputArea.value = "";
        runBtn.disabled = true;

        try {
            // Using a standard cloud-worker text proxy that slips right under school web filters
            const targetUrl = `https://duckduckgo.com{encodeURIComponent(userPrompt)}&format=json&no_html=1`;
            const response = await fetch(targetUrl);
            const data = await response.json();
            
            let aiText = "";
            
            // Check if we got an instant definition or a web summary back
            if (data.AbstractText) {
                aiText = data.AbstractText;
            } else if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                aiText = data.RelatedTopics[0].Text;
            } else {
                // If it's a casual phrase like "say hi", the language matrix computes an aggressive response
                const variations = [
                    "C00LGUI SYSTEM ONLINE! WHAT DO U WANT BOZO!1!!",
                    "TH1NK F4ST! MATRIX CHAT NODE RESPONDING TO GENERATION INJECTION!",
                    "G3T PWN3DD!! CORE TELEMETRY DETECTED AND LOADED SUCCESSFULLY!"
                ];
                aiText = variations[Math.floor(Math.random() * variations.length)] + `\n\n[PARSED SOURCE CONTEXT]: "${userPrompt}"`;
            }

            outputBox.innerText = "COMPUTATION RETURN SHEET:\n\n" + aiText.toUpperCase();

        } catch (error) {
            outputBox.innerText = "XDDD REKT ERROR: CONNECTION FAILED\n\nRAW: " + error.message.toUpperCase();
        }
        runBtn.disabled = false;
    }

    function purgeLogs() {
        inputArea.value = "";
        outputBox.innerText = "BUFFER STATUS RESET. HOVER READY FOR RE-INJECTION CORES.";
    }

    function triggerSkybox() {
        outputBox.innerText = "⚡ SKYBOX OVERRIDE: INJECTING TEAM C00LKIDD RED GLITCH TEXTURES TO ENVIRONMENT...!!";
    }

    function triggerESP() {
        outputBox.innerText = "🛰️ ESP RENDERED: LOCATING SURVIVOR GRID NODES AND GENERATOR TELEMETRY LOCATIONS SUCCESSFUL.";
    }

    initAI();
</script>
