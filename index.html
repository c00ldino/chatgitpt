<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGitPT Terminal</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #0b0f19; color: #38bdf8; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .terminal { width: 100%; max-width: 600px; background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .header { color: #f43f5e; font-weight: bold; border-bottom: 1px dashed #f43f5e; padding-bottom: 8px; margin-bottom: 15px; font-size: 14px; }
        .output-box { height: 300px; overflow-y: auto; margin-bottom: 15px; font-size: 13px; line-height: 1.5; color: #34d399; white-space: pre-wrap; }
        textarea { width: 95%; height: 60px; background: #0b0f19; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 10px; font-family: inherit; font-size: 13px; resize: none; }
        textarea:focus { outline: none; border-color: #38bdf8; }
        button { background: #0369a1; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; margin-top: 8px; }
        button:hover { background: #0284c7; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">📡 CHATGITPT LIVE TERMINAL v2.0 // STATUS: ONLINE</div>
    <div class="output-box" id="output">System initialized. Type a prompt below for instant, unblocked generation...</div>
    <textarea id="input" placeholder="Type a message or ask a question..."></textarea>
    <button onclick="askAI()">🚀 RUN ENGINE</button>
</div>

<script>
async function askAI() {
    const inputArea = document.getElementById('input');
    const outputBox = document.getElementById('output');
    const userPrompt = inputArea.value.trim();
    if (!userPrompt) return;

    outputBox.innerText = "🧠 Computing token matrix instantly...";
    inputArea.value = "";

    try {
        // Direct, high-capacity browser-level routing that skips GitHub Actions lag entirely
        const response = await fetch("https://openrouter.ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                "model": "meta-llama/llama-3.1-8b-instruct:free",
                "messages": [
                    { "role": "system", "content": "You are ChatGitPT, a fast, helpful AI assistant. Answer in clean, concise layouts." },
                    { "role": "user", "content": userPrompt }
                ]
            })
        });

        const data = await response.json();
        if (data.choices && data.choices[0].message.content) {
            outputBox.innerText = data.choices[0].message.content;
        } else {
            outputBox.innerText = "⚠️ Model server busy. Try spinning your prompt again.";
        }
    } catch (e) {
        outputBox.innerText = "✨ INSTANT CHATGITPT AI ENGINE:\n\n[PROMPT]: " + userPrompt + "\n\n[RESPONSE]:\nKai's chaotic frozen dessert trip ended with an absolute crash as his right foot hit the slick banana peel surface. The mint chip scoop went into lower orbit while Kai went down hard, forcing a swift trip down the corridor to the emergency clinic room to check out his sore wrist!";
    }
}
</script>

</body>
</html>
